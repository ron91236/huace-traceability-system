server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  datasource:
    # 数据库在服务器上运行，本地开发通过环境变量或默认连接服务器
    url: ${DB_URL:jdbc:mysql://8.152.162.118:3306/trace_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:8.152.162.118}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms
    mongodb:
      uri: ${MONGO_URI:mongodb://8.152.162.118:27017/trace_system}
      auto-index-creation: true
  cache:
    type: redis
    redis:
      time-to-live: 86400000
      cache-null-values: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置（生产环境必须通过 JWT_SECRET 环境变量注入，仓库内仅保留开发占位值）
jwt:
  secret: ${JWT_SECRET:huace-trace-dev-only-secret-not-for-production}
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload-dir: /data/trace/uploads
  url-prefix: /uploads

# Swagger配置（默认关闭，本地调试时设置 SWAGGER_ENABLED=true）
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

# 应用配置
app:
  base-url: http://trace.cti-pit.com

# 阿里云IoT配置
aliyun:
  iot:
    access-key-id: ${ALIYUN_AK_ID:}
    access-key-secret: ${ALIYUN_AK_SECRET:}
    endpoint: ${ALIYUN_IOT_ENDPOINT:iot.cn-shanghai.aliyuncs.com}
    instance-id: ${ALIYUN_IOT_INSTANCE_ID:}
    amqp:
      endpoint: ${ALIYUN_AMQP_ENDPOINT:}
      group-id: ${ALIYUN_AMQP_GROUP_ID:DEFAULT_GROUP}
      queue-name: ${ALIYUN_AMQP_QUEUE:iot-trace-queue}
  video:
    region-id: cn-shanghai
    endpoint: vs.cn-shanghai.aliyuncs.com

# IoT消息消费开关
iot:
  enabled: ${IOT_ENABLED:false}
  mock-enabled: ${IOT_MOCK:true}
